<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITEL}}</title>
<meta name="description" content="{{UNTERTITEL}}">
<link rel="alternate" type="application/atom+xml" title="Änderungen" href="/feed.xml">
<link rel="icon" type="{{FAVICON_TYP}}" href="{{FAVICON}}">
{{APPLE_ICON}}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2a55c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{TITEL}}">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>
<div class="wrap">
  <header class="kopf">
    <div class="marke">
      {{KOPF_LOGO}}
      <div>
        <h1 id="seitentitel" class="{{TITEL_KLASSE}}">{{TITEL}}</h1>
        <p class="unter">{{UNTERTITEL}}</p>
      </div>
    </div>
    <div class="kopf-rechts">
      <div class="segment" role="group" aria-label="Ansicht">
        <button data-ansicht="liste" aria-pressed="true">Liste</button>
        <button data-ansicht="monat" aria-pressed="false">Monat</button>
        <button data-ansicht="woche" aria-pressed="false">Woche</button>
        <button data-ansicht="aenderungen" aria-pressed="false">Änderungen</button>
      </div>
      <button class="icon-knopf" id="design-knopf" type="button"></button>
    </div>
  </header>

  <div class="layout">
    <details class="flaeche filter" id="filter-box" open>
      <summary>
        <span class="sum-titel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
          Filter und Abo
        </span>
        <span class="filter-zahl" data-filter-zahl hidden></span>
        <svg class="sum-pfeil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="filter-inhalt">
        <div class="filter-kopf">
          <h2>Filter</h2>
          <span class="filter-zahl" data-filter-zahl hidden></span>
          <button type="button" class="filter-reset" data-zuruecksetzen hidden>Zurücksetzen</button>
        </div>
        <div class="gruppe suche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="f-suche" placeholder="Set oder Code suchen" aria-label="Set oder Code suchen">
        </div>

        <div class="gruppe">
          <div class="gruppe-kopf"><h2>Spiele</h2>
            <div class="mini"><button type="button" data-alle="spiele">Alle</button><button type="button" data-keine="spiele">Keine</button></div></div>
          <div class="chips" id="f-spiele"></div>
        </div>

        <div class="gruppe">
          <div class="gruppe-kopf"><h2>Status</h2>
            <div class="mini"><button type="button" data-alle="status">Alle</button></div></div>
          <div class="chips" id="f-status"></div>
        </div>

        <div class="gruppe">
          <div class="gruppe-kopf"><h2>Produkttyp</h2>
            <div class="mini"><button type="button" data-alle="typ">Alle</button></div></div>
          <div class="chips" id="f-typ"></div>
        </div>

        <div class="gruppe">
          <div class="gruppe-kopf"><h2>Anzeige</h2></div>
          <label class="schalter"><input type="checkbox" id="f-prerelease"> Prerelease-Termine anzeigen</label>
          <label class="schalter"><input type="checkbox" id="f-ungenau" checked> Ungefähre Termine (Monat oder Quartal)</label>
          <label class="schalter"><input type="checkbox" id="f-vergangen"> Ältere Releases in der Liste</label>
        </div>

        <div class="abo">
          <div class="gruppe-kopf"><h2>Kalender abonnieren</h2></div>
          <input class="abo-url" id="abo-url" readonly aria-label="Abo-Adresse">
          <div class="knoepfe">
            <a class="knopf primaer" id="abo-webcal">Abonnieren</a>
            <button class="knopf" type="button" id="abo-kopieren">Link kopieren</button>
            <a class="knopf" id="abo-google" target="_blank" rel="noopener">Google Kalender</a>
          </div>
          <p class="hinweis">Das Abo enthält genau die Filter von oben. Neue Sets und Terminänderungen erscheinen automatisch in deiner Kalender-App.</p>
        </div>

        <div class="filter-aktionen">
          <button type="button" class="knopf" data-zuruecksetzen>Zurücksetzen</button>
          <button type="button" class="knopf primaer" id="filter-fertig">Termine anzeigen</button>
        </div>
      </div>
    </details>

    <main>
      <div class="leiste" id="leiste"></div>
      <div id="inhalt" aria-live="polite"></div>
    </main>
  </div>
</div>

<footer class="wrap fuss">{{FUSS}}</footer>

<dialog id="detail" aria-labelledby="detail-titel"></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="/static/hinweise.js" data-datenschutz="{{DATENSCHUTZ_URL}}"></script>
<script src="/static/app.js"></script>
</body>
</html>
