name: Tests und Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Wöchentlich neu bauen, damit Sicherheitsupdates des Basis-Images ankommen
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image lokal bauen und Startprobe
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tcg-kalender:probe
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starten und prüfen
        run: |
          docker run -d --name probe -p 8000:8000 -e ADMIN_PASSWORT=probe tcg-kalender:probe
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS "http://127.0.0.1:8000/kalender.ics?spiele=pokemon" | grep -q "BEGIN:VEVENT"
          test "$(docker exec probe id -u)" != "0" || (echo "Läuft als root" && exit 1)
          docker exec probe ls -la /data
          docker logs probe
          docker rm -f probe

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=TCG-Release-Kalender
            org.opencontainers.image.description=Selbst gehosteter Release-Kalender für Sammelkartenspiele mit filterbarem ICS-Abo

      - name: Bei GitHub Container Registry anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Multi-Arch-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
